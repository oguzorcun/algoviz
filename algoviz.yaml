apiVersion: apps/v1
kind: Deployment
metadata:
  name: algoviz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: algoviz
  template:
    metadata:
      labels:
        app: algoviz
    spec:
      containers:
        - name: algoviz
          image: algoviz:1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: algoviz
spec:
  selector:
    app: algoviz
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
